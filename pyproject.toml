[project]
name = "pepkio-realistic-random-seq-generator"
version = "0.1.0"
description = "Python client for Pepkio realistic-random-seq-generator tool"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0.0",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[project.scripts]
pepkio-realistic-random-seq-generator = "pepkio_realistic_random_seq_generator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pepkio_realistic_random_seq_generator"]

[dependency-groups]
dev = [
    "hatchling>=1.25.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "python-dotenv>=1.0.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
